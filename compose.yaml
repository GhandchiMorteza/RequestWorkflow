services:
  postgres:
    image: postgres:17-alpine
    container_name: request-workflow-postgres
    environment:
      POSTGRES_DB: request_workflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - request_workflow_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d request_workflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  request_workflow_postgres_data: